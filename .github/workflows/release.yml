name: Release NightMC

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build NightMC Setup (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Generate icon
        run: npm run icon

      - name: Build NightMC Setup
        env:
          NIGHTMC_MS_CLIENT_ID: ${{ vars.NIGHTMC_MS_CLIENT_ID }}
          NIGHTMC_UPDATE_REPO: ${{ github.repository }}
          NIGHTMC_NEWS_URL: ${{ vars.NIGHTMC_NEWS_URL }}
          NIGHTMC_UPDATE_PUBKEY: ${{ vars.NIGHTMC_UPDATE_PUBKEY }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:nsis

      - name: Verify artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/NightMC-Setup.exe')) {
            Write-Error 'Brak dist/NightMC-Setup.exe - build nie powiódł się'
            exit 1
          }
          Get-Item dist/NightMC-Setup.exe | Format-List Name, Length

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/NightMC-Setup.exe).Hash.ToLower()
          "$hash  NightMC-Setup.exe" | Out-File -Encoding ascii -NoNewline dist/NightMC-Setup.exe.sha256
          Write-Host "SHA-256: $hash"

      - name: Sign update manifest (optional)
        if: ${{ env.NIGHTMC_UPDATE_PRIVKEY != '' }}
        env:
          NIGHTMC_UPDATE_PRIVKEY: ${{ secrets.NIGHTMC_UPDATE_PRIVKEY }}
        run: node scripts/sign-update.mjs dist/NightMC-Setup.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NightMC-windows-x64
          path: |
            dist/NightMC-Setup.exe
            dist/NightMC-Setup.exe.sha256
            dist/NightMC-Setup.exe.sig
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NightMC ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/NightMC-Setup.exe
            dist/NightMC-Setup.exe.sha256
            dist/NightMC-Setup.exe.sig
